[filters.melos-test]
description = "Compact melos test output — strip per-test progress while keeping failures and summaries"
match_command = "^(fvm\\s+exec\\s+)?melos\\s+(run\\s+)?test(\\s|$)"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^\\s*$",
  "^QuestionnaireWidget:",
  "^\\[[^]]+\\]:\\s+QuestionnaireWidget:",
  "^\\d\\d:\\d\\d\\s+\\+\\d+\\s*:\\s*loading\\b",
  "^\\[[^]]+\\]:\\s+\\d\\d:\\d\\d\\s+\\+\\d+\\s*:\\s*loading\\b",
  "^\\d\\d:\\d\\d\\s+\\+\\d+\\s*:\\s*(test|integration_test)/",
  "^\\[[^]]+\\]:\\s+\\d\\d:\\d\\d\\s+\\+\\d+\\s*:\\s+(/|test|integration_test)",
]
max_lines = 120

[[tests.melos-test]]
name = "melos test strips progress but keeps summaries"
input = """
00:00 +0: loading test/foo_test.dart
00:00 +1: test/foo_test.dart: passes
QuestionnaireWidget: Answer received for question q1 - Answer(q1: yes)
00:00 +1: All tests passed!
studyu_app: SUCCESS
"""
expected = "00:00 +1: All tests passed!\nstudyu_app: SUCCESS"

