studyu_app: SUCCESS
--------------------------------------------------------------------------------
studyu_core:
Formatted 149 files (0 changed) in 0.13 seconds.
studyu_core: SUCCESS
--------------------------------------------------------------------------------

$ melos format
  └> dart format .
     └> SUCCESS
"""
expected = "melos format: ok (0 files changed)"

[[tests.melos-format]]
name = "melos format with changes"
input = """
$ melos format
  └> dart format .
     └> RUNNING (in 1 packages)

--------------------------------------------------------------------------------
studyu_app:
Formatted 3 files (2 changed) in 0.10 seconds.
studyu_app: SUCCESS
--------------------------------------------------------------------------------

$ melos format
  └> dart format .
     └> SUCCESS
"""
expected = "Formatted 3 files (2 changed) in 0.10 seconds."

