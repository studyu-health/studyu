name = "melos test keeps failure details"
input = """
00:00 +0 -1: test/foo_test.dart: fails [E]
  Expected: true
    Actual: false
00:00 +0 -1: Some tests failed.
studyu_app: FAILURE
"""
expected = "00:00 +0 -1: test/foo_test.dart: fails [E]\n  Expected: true\n    Actual: false\n00:00 +0 -1: Some tests failed.\nstudyu_app: FAILURE"

[filters.melos-format]
description = "Compact melos format — only show packages with actual changes"
match_command = "^((fvm\\s+)?dart\\s+format|(fvm\\s+(exec\\s+)?)?melos\\s+format)\\b"
strip_ansi = true
filter_stderr = true
keep_lines_matching = [
  "(?i)(error|exception|failed|failure|could not|not found|invalid|missing|denied|timed out|unable)",
  "^\\s*(error|warning|info) - ",
  "^\\s*[A-Za-z0-9_./:-]+:\\d+:\\d+",
  "^\\s*[A-Za-z0-9_./:-]+:\\d+",
  "^Formatted \\d+ files? \\([1-9]\\d* changed\\)",
]
on_empty = "melos format: ok (0 files changed)"
max_lines = 60
[[tests.melos-format]]
